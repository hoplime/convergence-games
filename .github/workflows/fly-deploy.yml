# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.dev.toml --app convergence-games-dev --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) --label sha=${GITHUB_SHA::7} --label repo=${{ github.repository }} --label run=${{ github.run_id }} --label branch=${{ github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NPMRC: ${{ secrets.NPMRC }}

  deploy-prod:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy-dev
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.prod.toml --app convergence-games --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) --label sha=${GITHUB_SHA::7} --label repo=${{ github.repository }} --label run=${{ github.run_id }} --label branch=${{ github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NPMRC: ${{ secrets.NPMRC }}
